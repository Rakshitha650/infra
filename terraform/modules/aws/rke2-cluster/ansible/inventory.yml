---
all:
  vars:
    cluster_name: "openg2p"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "v1.2.1.0"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip-obsrv.mantra-identity.com/v3/import/v6ckg4g2h68qj99gz2mpbttjcrp4bnnq9z8sbqmnnbhjmp4cmsv7k6_c-m-mjfg7dj4.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        openg2p-CONTROL-PLANE-NODE-1:
          ansible_host: 10.0.4.70
          node_role: control_plane
          is_primary: true
          node_index: 0
    
    etcd:
      hosts:
        openg2p-ETCD-NODE-1:
          ansible_host: 10.0.4.238
          node_role: etcd
    

    rke2_cluster:
      children:
        control_plane:
        etcd:
