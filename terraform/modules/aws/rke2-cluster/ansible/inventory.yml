---
all:
  vars:
    cluster_name: "demo"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "v1.2.1.0"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: true
    rancher_import_url: "kubectl apply -f https://rancher.mosip-obsrv.mantra-identity.com/v3/import/q5fsc97tkhxmx9fkxsvtm7l8chhz74jlt4xs4s9mpq7nfthlm88ph7_c-m-5fgwqhzq.yaml"
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        demo-CONTROL-PLANE-NODE-1:
          ansible_host: 10.0.4.93
          node_role: control_plane
          is_primary: true
          node_index: 0
        demo-CONTROL-PLANE-NODE-2:
          ansible_host: 10.0.3.6
          node_role: control_plane
          is_primary: false
          node_index: 1
        demo-CONTROL-PLANE-NODE-3:
          ansible_host: 10.0.4.26
          node_role: control_plane
          is_primary: false
          node_index: 2
    
    etcd:
      hosts:
        demo-ETCD-NODE-1:
          ansible_host: 10.0.4.211
          node_role: etcd
        demo-ETCD-NODE-2:
          ansible_host: 10.0.3.53
          node_role: etcd
        demo-ETCD-NODE-3:
          ansible_host: 10.0.4.156
          node_role: etcd
    
    workers:
      hosts:
        demo-WORKER-NODE-1:
          ansible_host: 10.0.4.108
          node_role: worker
        demo-WORKER-NODE-2:
          ansible_host: 10.0.3.196
          node_role: worker
        demo-WORKER-NODE-3:
          ansible_host: 10.0.4.199
          node_role: worker
        demo-WORKER-NODE-4:
          ansible_host: 10.0.3.163
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
