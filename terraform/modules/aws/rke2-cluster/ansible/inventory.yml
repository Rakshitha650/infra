---
all:
  vars:
    cluster_name: "mosip-obsrv"
    cluster_env_domain: "mosip.local"
    k8s_infra_repo_url: "https://github.com/mosip/k8s-infra.git"
    k8s_infra_branch: "v1.2.1.1"
    install_rke2_version: "v1.28.9+rke2r1"
    enable_rancher_import: false
    rancher_import_url: 
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ./ssh_key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    
  children:
    control_plane:
      hosts:
        mosip-obsrv-CONTROL-PLANE-NODE-1:
          ansible_host: 10.0.4.227
          node_role: control_plane
          is_primary: true
          node_index: 0
    
    etcd:
      hosts:
        mosip-obsrv-ETCD-NODE-1:
          ansible_host: 10.0.4.46
          node_role: etcd
    
    workers:
      hosts:
        mosip-obsrv-WORKER-NODE-1:
          ansible_host: 10.0.4.95
          node_role: worker

    rke2_cluster:
      children:
        control_plane:
        etcd:
        workers:
